          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          maxLength: 150
        position:
          type: string
          maxLength: 100
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          description: Kosong bila masih bekerja
          nullable: true
        reason_leaving:
          type: string
          maxLength: 255
          nullable: true
      required:
      - company
      - position
    FamilyMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        relationship:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 150
        age:
          type: integer
          nullable: true
        occupation:
          type: string
          maxLength: 100
          nullable: true
      required:
      - relationship
      - name
    EmergencyContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        relationship:
          type: string
          maxLength: 30
        phone:
          type: string
          maxLength: 20
      required:
      - name
      - relationship
      - phone
    Reference:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        relationship:
          type: string
          maxLength: 30
        phone:
          type: string
          maxLength: 20
        address:
          type: string
          nullable: true
      required:
      - name
      - relationship
      - phone
    ApplicationDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        doc_type:
          type: string
          enum:
          - CV
          - KTP
          - SKCK
          - IJAZAH
          - SURAT_SEHAT
        file_name:
          type: string
          maxLength: 255
        mime_type:
          type: string
          maxLength: 100
        size_bytes:
          type: integer
        uploaded_at:
          type: string
          format: date-time
    DocumentUpload:
      type: object
      properties:
        doc_type:
          type: string
          enum:
          - CV
          - KTP
          - SKCK
          - IJAZAH
          - SURAT_SEHAT
        file:
          type: string
          format: binary
          description: PDF/JPG, ukuran maksimum 5 MB. Lebih dari itu dibalas 422.
      required:
      - doc_type
      - file
    SignedUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
      - url
      - expires_at
    CvExtraction:
      type: object
      properties:
        status:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
        extracted_data:
          type: object
          properties:
            profile:
              $ref: '#/components/schemas/ApplicantProfile'
            educations:
              type: array
              items:
                $ref: '#/components/schemas/Education'
            work_histories:
              type: array
              items:
                $ref: '#/components/schemas/WorkHistory'
          description: Hanya saran autofill; tidak otomatis disimpan. Field bisa kosong.
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - status
    ApplicationForm:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/Application'
        profile:
          allOf:
          - $ref: '#/components/schemas/ApplicantProfile'
          nullable: true
        educations:
          type: array
          items:
            $ref: '#/components/schemas/Education'
        work_histories:
          type: array
          items:
            $ref: '#/components/schemas/WorkHistory'
        family_members:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMember'
        emergency_contacts:
          type: array
          items:
            $ref: '#/components/schemas/EmergencyContact'
        references:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationDocument'
    StatusHistory:
      type: object
      properties:
        from_status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - SCREENING_PASSED
          - SCREENING_FAILED
          - ASSESSMENT_IN_PROGRESS
          - ASSESSMENT_PASSED
          - ASSESSMENT_FAILED
          - INTERVIEW_PENDING
          - INTERVIEW_DONE
          - FINALIZED
          nullable: true
        to_status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - SCREENING_PASSED
          - SCREENING_FAILED
          - ASSESSMENT_IN_PROGRESS
          - ASSESSMENT_PASSED
          - ASSESSMENT_FAILED
          - INTERVIEW_PENDING
          - INTERVIEW_DONE
          - FINALIZED
        changed_by_name:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        changed_at:
          type: string
          format: date-time
    AdminValidation:
      type: object
      properties:
        match_score_percent:
          type: number
          minimum: 0
          maximum: 100
        criteria_met_count:
          type: integer
        is_passed:
          type: boolean
        evaluated_at:
          type: string
          format: date-time
        criteria:
          type: array
          items:
            type: object
            properties:
              criterion_id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              is_mandatory:
                type: boolean
              applicant_value:
                type: string
                nullable: true
              is_met:
                type: boolean
    AssessmentSession:
      type: object
      properties:
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - SUBMITTED
          - EXPIRED
        started_at:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        server_time:
          type: string
          format: date-time
          description: Untuk sinkronisasi timer di klien
        answered_count:
          type: integer
        total_questions:
          type: integer
          example: 99
      required:
      - status
      - server_time
