  /me/applications/{applicationId}/documents:
    post:
      tags:
      - Lamaran (Pelamar)
      summary: Unggah dokumen
      operationId: uploadDocument
      description: 'Satu berkas per doc_type; unggahan ulang menggantikan yang lama. Bila doc_type = CV, ekstraksi
        AI berjalan asinkron (FR-6).


        **Peran:** APPLICANT'
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
