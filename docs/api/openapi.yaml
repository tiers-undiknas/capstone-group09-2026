          $ref: '#/components/responses/ServerError'
  /admin/job-postings/{jobPostingId}/final-scores/calculate:
    post:
      tags:
      - Admin - Skor & Keputusan
      summary: Hitung ulang skor akhir & peringkat
      operationId: calculateFinalScores
      description: 'Untuk pelamar berstatus INTERVIEW_DONE; memakai snapshot bobot saat ini (FR-28, FR-29, FR-32).


        **Peran:** ADMIN'
      parameters:
      - $ref: '#/components/parameters/JobPostingId'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  calculated:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
