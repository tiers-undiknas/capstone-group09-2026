          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /me/applications/{applicationId}/documents/{documentId}:
    delete:
      tags:
      - Lamaran (Pelamar)
      summary: Hapus dokumen
      operationId: deleteDocument
      description: 'Hanya saat DRAFT.


        **Peran:** APPLICANT'
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Berhasil
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /me/applications/{applicationId}/documents/{documentId}/url:
    get:
      tags:
      - Lamaran (Pelamar)
      summary: Tautan unduh dokumen sendiri
      operationId: getMyDocumentUrl
      description: 'Signed URL berumur pendek (NFR-6).


        **Peran:** APPLICANT'
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SignedUrl'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /me/applications/{applicationId}/cv-extraction:
    get:
      tags:
      - Lamaran (Pelamar)
      summary: Status & hasil ekstraksi CV
      operationId: getCvExtraction
      description: 'Di-polling klien setelah unggah CV. Hasil hanya saran autofill (FR-6).


        **Peran:** APPLICANT'
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CvExtraction'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /me/applications/{applicationId}/submit:
    post:
      tags:
      - Lamaran (Pelamar)
