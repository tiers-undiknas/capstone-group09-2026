        '500':
          $ref: '#/components/responses/ServerError'
  /admin/applications/{applicationId}/decision:
    post:
      tags:
      - Admin - Skor & Keputusan
      summary: Tetapkan keputusan akhir
      operationId: decideApplication
      description: 'Manual oleh Admin/HRD; status menjadi FINALIZED dan email dikirim (FR-30, FR-33).


        **Peran:** ADMIN, HRD'
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FinalDecision'
                required:
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/applications/{applicationId}/hr-sync:
    post:
      tags:
      - Admin - Skor & Keputusan
      summary: '[P2] Kirim kandidat diterima ke sistem HR IGA'
      operationId: syncToHrSystem
      description: 'Fitur P2 (FR-34). Meneruskan data ke sistem HR/absensi melalui middleware CMA Solutions Indonesia.
        Format dan endpoint tujuan menunggu spesifikasi dari CMA.


        **Peran:** ADMIN'
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HrSyncResult'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobPostingId:
      name: jobPostingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AvailabilityId:
      name: availabilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Permintaan tidak dapat diproses
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Belum login atau token tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Peran tidak berhak mengakses sumber daya ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Status data tidak mengizinkan aksi ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Validasi gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooMany:
      description: Terlalu banyak percobaan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Kesalahan server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Terjadi kesalahan.
      required:
      - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Data yang dikirim tidak valid.
        errors:
          type: object
          properties: {}
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
            - Email sudah terdaftar.
      required:
      - message
      - errors
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 255
          format: email
        full_name:
          type: string
          maxLength: 150
        role:
          type: string
          enum:
          - APPLICANT
          - ADMIN
          - HRD
        is_email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - full_name
      - role
    RegisterRequest:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          maxLength: 255
          format: email
        password:
          type: string
          maxLength: 72
          minLength: 8
          format: password
        password_confirmation:
          type: string
          maxLength: 72
          format: password
        consents:
          type: array
          items:
            type: object
            properties:
              consent_type:
                type: string
                enum:
                - PRIVACY_POLICY
                - SPECIAL_DATA
                - AI_PROCESSING
              policy_version:
                type: string
                maxLength: 20
            required:
            - consent_type
            - policy_version
          description: Wajib memuat ketiga jenis persetujuan (UU PDP).
          minItems: 3
      required:
      - full_name
      - email
      - password
      - password_confirmation
      - consents
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          format: email
        password:
          type: string
          format: password
      required:
      - email
      - password
    AuthToken:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Masa berlaku token dalam detik (7200 = 120 menit)
          example: 7200
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - token_type
      - expires_in
      - user
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          format: email
      required:
      - email
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          description: Token dari tautan email
      required:
      - token
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          maxLength: 72
          minLength: 8
          format: password
        password_confirmation:
          type: string
          maxLength: 72
          format: password
      required:
      - token
      - password
      - password_confirmation
    Position:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
          example: Anggota
      required:
      - id
      - name
    JobPostingPosition:
      type: object
      properties:
        position_id:
          type: integer
        name:
          type: string
          maxLength: 50
          readOnly: true
        quota:
          type: integer
          minimum: 1
      required:
      - position_id
      - quota
    JobPostingPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        placement_location:
          type: string
          maxLength: 200
        timezone:
          type: string
          maxLength: 40
          example: Asia/Makassar
        description:
          type: string
          nullable: true
        open_at:
          type: string
          format: date-time
          nullable: true
        close_at:
          type: string
          format: date-time
          nullable: true
        positions:
          type: array
          items:
            $ref: '#/components/schemas/JobPostingPosition'
    JobPostingInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        placement_location:
          type: string
          maxLength: 200
        timezone:
          type: string
          maxLength: 40
          example: Asia/Makassar
        description:
          type: string
          nullable: true
        min_criteria_met:
          type: integer
          minimum: 0
          example: 5
        assessment_min_score:
          type: number
          minimum: 0
          example: 60
        open_at:
          type: string
          format: date-time
          nullable: true
        close_at:
          type: string
          format: date-time
          nullable: true
          description: Harus setelah open_at
      required:
      - title
      - placement_location
      - min_criteria_met
      - assessment_min_score
    JobPosting:
      allOf:
      - $ref: '#/components/schemas/JobPostingInput'
      - type: object
        properties:
          id:
            type: string
            format: uuid
          status:
            type: string
            enum:
            - DRAFT
            - OPEN
            - CLOSED
          positions:
            type: array
            items:
              $ref: '#/components/schemas/JobPostingPosition'
          created_by:
            type: string
            format: uuid
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
    QualificationCriterion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 30
          example: HEIGHT
          description: AGE, HEIGHT, DOMICILE, CERT, DOCS, EXPERIENCE, dst.
        name:
          type: string
          maxLength: 100
          example: Tinggi badan minimal
        source_field:
          type: string
          maxLength: 100
          example: applicant_profiles.height_cm
          description: Nama kolom atau kode kriteria terhitung
        operator:
          type: string
          enum:
          - GTE
          - LTE
          - EQ
          - IN
          - BETWEEN
        value:
          description: 'Nilai pembanding: angka, teks, daftar, atau {min,max}'
          example:
            min: 165
        is_mandatory:
          type: boolean
        weight:
          type: number
          minimum: 0
          example: 10
        order_no:
          type: integer
      required:
      - code
      - name
      - source_field
      - operator
      - value
      - is_mandatory
      - weight
      - order_no
    ScoreWeights:
      type: object
      properties:
        ADMIN:
          type: number
          minimum: 0
          maximum: 100
          example: 20
        ASSESSMENT:
          type: number
          minimum: 0
          maximum: 100
          example: 30
        INTERVIEW:
          type: number
          minimum: 0
          maximum: 100
          example: 50
      required:
      - ADMIN
      - ASSESSMENT
      - INTERVIEW
      description: Total harus 100 (FR-31)
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_posting_id:
          type: string
          format: uuid
        job_title:
          type: string
          readOnly: true
        position_id:
          type: integer
        position_name:
          type: string
          readOnly: true
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - SCREENING_PASSED
          - SCREENING_FAILED
          - ASSESSMENT_IN_PROGRESS
          - ASSESSMENT_PASSED
          - ASSESSMENT_FAILED
          - INTERVIEW_PENDING
          - INTERVIEW_DONE
          - FINALIZED
        expected_salary:
          type: number
          minimum: 0
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateApplicationRequest:
      type: object
      properties:
        job_posting_id:
          type: string
          format: uuid
        position_id:
          type: integer
      required:
      - job_posting_id
      - position_id
    UpdateApplicationRequest:
      type: object
      properties:
        position_id:
          type: integer
        expected_salary:
          type: number
          minimum: 0
          nullable: true
    ApplicantProfile:
      type: object
      properties:
        nik:
          type: string
          maxLength: 16
          pattern: ^[0-9]{16}$
        birth_place:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum:
          - LAKI_LAKI
          - PEREMPUAN
        religion:
          type: string
          maxLength: 30
          nullable: true
        marital_status:
          type: string
          maxLength: 20
          nullable: true
        phone:
          type: string
          maxLength: 20
          example: 081234567890
        address:
          type: string
        domicile_city:
          type: string
          maxLength: 100
          example: Denpasar
        height_cm:
          type: number
          minimum: 100
          maximum: 250
        weight_kg:
          type: number
          minimum: 30
          maximum: 250
          nullable: true
        blood_type:
          type: string
          maxLength: 3
          nullable: true
        martial_arts_skill:
          type: string
          maxLength: 100
          nullable: true
        security_certificate:
          type: string
          maxLength: 100
          example: Gada Pratama
          nullable: true
      required:
      - nik
      - birth_place
      - birth_date
      - gender
      - phone
      - address
      - domicile_city
      - height_cm
    Education:
      type: object
