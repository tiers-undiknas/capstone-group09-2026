      type: object
      properties:
        access_token:
          type: string
          description: Token dari tautan email assessment (FR-11)
      required:
      - access_token
    AssessmentQuestionSet:
      type: object
      properties:
        deadline_at:
          type: string
          format: date-time
        modules:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              order_no:
                type: integer
              questions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    order_no:
                      type: integer
                    question_text:
                      type: string
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          option_label:
                            type: string
                            maxLength: 5
                          option_text:
                            type: string
                        description: score_value tidak pernah dikirim ke pelamar
                    selected_option_id:
                      type: integer
                      nullable: true
    AnswerRequest:
      type: object
      properties:
        question_id:
          type: integer
        option_id:
          type: integer
      required:
      - question_id
      - option_id
    AssessmentResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - SUBMITTED
          - EXPIRED
        total_score:
          type: number
          nullable: true
        is_passed:
          type: boolean
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        module_scores:
          type: array
          items:
            type: object
            properties:
              module_id:
                type: integer
              module_name:
                type: string
              raw_score:
                type: number
              classification:
                type: string
                enum:
                - TINGGI
                - SEDANG
                - RENDAH
