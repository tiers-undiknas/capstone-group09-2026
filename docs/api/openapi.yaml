openapi: 3.0.3
info:
  title: API Sistem Rekrutmen Security IGA
  version: 0.1.1
  description: 'Kontrak API Sistem Rekrutmen Karyawan Security Berbasis AI - PT Indra Garda Agung.


    Kelompok 9 - Capstone TI Undiknas. Mengacu pada SRS dan Kamus Data ERD.


    Konvensi:

    - Semua waktu ISO 8601 (UTC di server); klien menampilkan sesuai `timezone` lowongan.

    - Respons tunggal dibungkus `data`; daftar berhalaman memakai `data` + `meta`.

    - 422 memakai format `errors` per field.

    - Autentikasi: Bearer token (JWT) dari `/auth/login`; RBAC per peran APPLICANT, ADMIN, HRD (NFR-5).

    - Token akses berlaku 120 menit (`expires_in` = 7200), lebih lama dari durasi tes assessment 60 menit. Logout mencabut token.

    - Unggahan dokumen maksimal 5 MB per berkas, format PDF/JPG.'
  contact:
    name: 'Kelompok 9 - Capstone TI Undiknas'
servers:
- url: http://localhost:8000/api/v1
  description: Lokal
- url: https://staging.example.com/api/v1
  description: Staging (ganti dengan domain tim)
security:
- bearerAuth: []
tags:
- name: Auth
- name: Lowongan Publik
- name: Lamaran (Pelamar)
- name: Assessment (Pelamar)
- name: Admin - Lowongan
- name: Admin - Pelamar
- name: Admin - Interview
- name: HRD - Interview
- name: Admin - Skor & Keputusan
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Registrasi akun pelamar
      operationId: register
      description: Membuat akun, menyimpan persetujuan UU PDP, dan mengirim email verifikasi (FR-1, FR-2, FR-3).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                required:
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/email/verify:
    post:
      tags:
      - Auth
      summary: Verifikasi email
      operationId: verifyEmail
      description: Token sekali pakai dari email (FR-3).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/email/resend:
    post:
      tags:
      - Auth
      summary: Kirim ulang email verifikasi
      operationId: resendVerification
      description: Selalu membalas 202 agar tidak membocorkan email terdaftar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooMany'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: login
      description: Login dengan email dan kata sandi (FR-4). Akun pelamar yang belum verifikasi email ditolak 403. Token berlaku 120 menit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: logout
      description: Mencabut token aktif.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Profil akun yang sedang login
      operationId: me
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/password/forgot:
    post:
      tags:
      - Auth
      summary: Minta tautan reset kata sandi
      operationId: forgotPassword
      description: Selalu membalas 202 (FR-4).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooMany'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/password/reset:
    post:
      tags:
      - Auth
      summary: Reset kata sandi
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /job-postings:
    get:
      tags:
      - Lowongan Publik
      summary: Daftar lowongan berstatus OPEN
      operationId: listOpenJobPostings
      description: Tujuan tautan dari iklan media sosial (FR-1).
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobPostingPublic'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required:
                - data
                - meta
        '500':
          $ref: '#/components/responses/ServerError'
  /job-postings/{jobPostingId}:
    get:
      tags:
      - Lowongan Publik
      summary: Detail lowongan
      operationId: getOpenJobPosting
      security: []
      parameters:
      - $ref: '#/components/parameters/JobPostingId'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobPostingPublic'
                required:
                - data
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /positions:
    get:
      tags:
      - Lowongan Publik
      summary: Daftar posisi
      operationId: listPositions
      security: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'
                required:
                - data
        '500':
          $ref: '#/components/responses/ServerError'
  /me/applications:
    get:
      tags:
      - Lamaran (Pelamar)
      summary: Daftar lamaran milik pelamar
      operationId: listMyApplications
      description: '**Peran:** APPLICANT'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                required:
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Lamaran (Pelamar)
      summary: Mulai lamaran (DRAFT)
      operationId: createApplication
      description: 'Satu pelamar hanya satu lamaran per lowongan (FR-7).


        **Peran:** APPLICANT'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
                required:
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /me/applications/{applicationId}:
    get:
      tags:
      - Lamaran (Pelamar)
      summary: Ambil seluruh isi formulir lamaran
      operationId: getMyApplication
      description: '**Peran:** APPLICANT'
      parameters:
