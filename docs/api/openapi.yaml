          format: uuid
        schedule_id:
          type: string
          format: uuid
        stage:
          type: string
          enum:
          - OPS
          - HRD_1
          - HRD_2
        submitted_by:
          $ref: '#/components/schemas/Interviewer'
        total_score:
          type: number
        normalized_score:
          type: number
          minimum: 0
          maximum: 100
        conclusion:
          type: string
          nullable: true
        conclusion_result:
          type: string
          enum:
          - DITERIMA
          - DIPERTIMBANGKAN
          - TIDAK_DITERIMA
          nullable: true
        submitted_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              aspect_id:
