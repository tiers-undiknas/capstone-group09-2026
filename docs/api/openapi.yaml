          - SCREENING_FAILED
          - ASSESSMENT_IN_PROGRESS
          - ASSESSMENT_PASSED
          - ASSESSMENT_FAILED
          - INTERVIEW_PENDING
          - INTERVIEW_DONE
          - FINALIZED
        match_score_percent:
          type: number
          nullable: true
        assessment_score:
          type: number
          nullable: true
        final_score:
          type: number
          nullable: true
        rank_no:
          type: integer
          nullable: true
        decision:
          type: string
          enum:
          - DITERIMA
          - DIPERTIMBANGKAN
          - TIDAK_DITERIMA
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
    ApplicationDetail:
