          type: string
          format: uuid
        applicant_name:
          type: string
        position_name:
          type: string
        stage:
          type: string
          enum:
          - OPS
          - HRD_1
          - HRD_2
        scheduled_at:
          type: string
          format: date-time
        timezone:
          type: string
          example: Asia/Makassar
        status:
          type: string
          enum:
          - SCHEDULED
          - DONE
          - CANCELLED
