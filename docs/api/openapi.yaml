              $ref: '#/components/schemas/InterviewSchedule'
          interview_evaluations:
            type: array
            items:
              $ref: '#/components/schemas/InterviewEvaluation'
          final_score:
            allOf:
            - $ref: '#/components/schemas/FinalScore'
