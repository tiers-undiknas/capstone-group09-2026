      tags:
      - Lamaran (Pelamar)
      summary: Simpan kontak darurat
      operationId: putEmergencyContacts
      description: 'Mengganti seluruh daftar dengan isi request. Hanya saat DRAFT (FR-5).


        **Peran:** APPLICANT'
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      requestBody:
