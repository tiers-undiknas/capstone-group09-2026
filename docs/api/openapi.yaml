        institution:
          type: string
          maxLength: 150
        major:
          type: string
          maxLength: 100
          nullable: true
        year_start:
          type: integer
          nullable: true
        year_end:
          type: integer
          nullable: true
      required:
      - level
      - institution
    WorkHistory:
      type: object
      properties:
