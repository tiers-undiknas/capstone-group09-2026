        max_score:
          type: number
        weight:
          type: number
        order_no:
          type: integer
    EvaluationRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              aspect_id:
                type: integer
              score:
                type: number
                minimum: 0
                description: Tidak boleh melebihi max_score aspek
              note:
                type: string
                nullable: true
            required:
            - aspect_id
            - score
          description: Wajib mencakup seluruh aspek aktif pada tahap ini
        conclusion:
          type: string
          nullable: true
        conclusion_result:
          type: string
          enum:
          - DITERIMA
          - DIPERTIMBANGKAN
          - TIDAK_DITERIMA
          nullable: true
      required:
      - items
    InterviewEvaluation:
      type: object
      properties:
        id:
